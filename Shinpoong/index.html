<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신풍제약리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>
            <div class="top-bar">
                <h1 class="logo">
                    <a href="#">
                        <img src="img/logo.png" alt="신풍제약주식회사 SHIN POONG PHARM. CO., LTD.">
                    </a>
                </h1>
            </div>
            <nav class="gnb">
                <ul>
                    <li><a href="#">제품정보</a></li>
                    <li><a href="#">R&amp;D</a></li>
                    <li><a href="#">투자정보</a></li>
                    <li><a href="#">채용정보</a></li>
                    <li><a href="#">기업정보</a></li>
                    <li><a href="#">뉴스</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide dark">
                            <img src="img/hero-lab.png" alt="시험관에 시약을 떨어뜨리는 연구 장면">
                            <div class="hero-txt">
                                <h2>인류의 건강을 향한<br>신풍의 위대한 도전</h2>
                                <p>자체 연구개발을 통해 축적한 기술과 경험으로<br>더 나은 치료의 가능성을 탐구합니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 스크롤하는 동안 화면에 고정되고, 양옆 사진이 차례대로 앞으로 나옴 -->
            <section class="rnd-sec">
                <div class="rnd-inner">
                <div class="rnd-stack left">
                    <img src="img/rnd-left1.png" alt="백신 연구">
                    <img src="img/rnd-left2.png" alt="연구실 실험">
                    <img src="img/rnd-left3.png" alt="시럽 의약품">
                </div>
                <div class="rnd-txt">
                    <p class="rnd-label">Research &amp; Development</p>
                    <h2>끊임 없는 연구와 혁신으로,<br>인류의 건강한 미래를 만들어 갑니다.</h2>
                    <p class="rnd-desc">신풍제약은 신약개발과 의약품 연구를 통해<br>치료의 가능성을 넓히고 더 나은 의료 환경을 만들어갑니다.</p>
                    <a href="#" class="rnd-btn">더보기</a>
                </div>
                <div class="rnd-stack right">
                    <img src="img/rnd-right1.png" alt="주사 진료">
                    <img src="img/rnd-right2.png" alt="무균 연구실">
                    <img src="img/rnd-right3.png" alt="피펫 실험">
                </div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        // 히어로는 지금 사진 한 장이라 넘김 기능 없이 실행만 해 둠
        const swiper = new Swiper('.swiper', {
            direction: 'horizontal',
        });

        // R&D 섹션: 삼천리 Who We Are처럼 스크롤 진행도(0~1)에 맞춰
        // 사진 3장이 안쪽 깊은 곳(x, z)에서 앞으로 다가오고, 맨 앞 사진은 화면 밖으로 빠져나감
        const rndSec = document.querySelector('.rnd-sec');
        const rndCards = [
            // [시작 x, 끝 x, 시작 z, 끝 z, 시작 각도, 끝 각도, 시작 투명도, 끝 투명도] (x, z는 vw)
            [0, -120, 0, 30, -2, 12, 1, 0.3],
            [46, -60, -35, 21, -16, 6, 0.75, 1],
            [122, 0, -92, 0, -28, -2, 0.4, 1]
        ];

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function updateRnd() {
            const rect = rndSec.getBoundingClientRect();
            const total = rndSec.offsetHeight - window.innerHeight;
            const p = Math.min(Math.max(-rect.top / total, 0), 1);
            const vw = window.innerWidth / 100;

            document.querySelectorAll('.rnd-stack').forEach(function (stack) {
                // 오른쪽은 왼쪽을 거울처럼 뒤집음
                const dir = stack.classList.contains('right') ? -1 : 1;
                stack.querySelectorAll('img').forEach(function (img, i) {
                    const c = rndCards[i];
                    const x = lerp(c[0], c[1], p) * vw * dir;
                    const z = lerp(c[2], c[3], p) * vw;
                    // 사진에 이미 기울기가 있어서 회전은 절반만
                    const r = lerp(c[4], c[5], p) * dir * 0.5;
                    img.style.transform = 'translate3d(' + x + 'px, 0, ' + z + 'px) rotateY(' + r + 'deg)';
                    img.style.opacity = lerp(c[6], c[7], Math.min(p * 2, 1));
                });
            });
        }
        window.addEventListener('scroll', updateRnd);
        window.addEventListener('resize', updateRnd);
        updateRnd();
    </script>
</body>
</html>
