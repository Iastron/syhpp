<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
    <link rel="stylesheet" href="../font/css/sdgothicneo.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="css/common.css">
    <title>버거킹 로그인 화면</title>
    <style>
        .login_option {
            margin-top: 12px;
        }

        .login_option label {
            /* label요소가 span요소를 정확히 감싸기 위해 적용 */
            display: inline-flex;
        }

        .login_option label:first-child {
            margin-right: 30px;
        }

        .login_option span {
            /* 각각의 span을 좌우 정렬하기 위해 inline-flex사용 */
            display: inline-flex;
            align-items: center;
            column-gap: 6px;
        }        

        .login_option .check + span::before {
            content: "";
            display: inline-block;
            width: 30px;
            height: 30px;
            background: url(img/checkBox_disabled.svg) no-repeat center / contain;
        }
        .login_option .check:checked + span:before {
            content: "";
            background-image: url(img/checkBox_active.svg);
        }

        a {
            text-decoration: none;
        }
        .login_link {
            margin-top: 20px;
            font-family: var(--font-pre);
            font-weight: 500;
            font-size: 1.4rem;
            text-align: center;
        }
        .login_link a {
            display: inline-flex;
            align-items: center;
            column-gap: 4px;
        }
        .login_link a::after {
            content: "";
            display: inline-block;
            width: 1px;
            height: 12px;
            background-color: var(--primary);
            opacity: 0.5;
        }
        .login_link a:last-child::after {
            content: "";
            display: none;
        }
        .sns_login {
            margin-top: 96px;
        }
        .sns_login > p {
            display: flex;
            justify-content: center;
            align-items: center;
            column-gap: 12px;
            margin-bottom: 35px;
            font-size: 1.3rem;
            color: var(--text);
            /* 줄바꿈을 하지않겠다 */
            white-space: nowrap;
        }
        .sns_login > p::before,
        .sns_login > p::after {
            content: "";
            display: inline-block;
            width: 100%;
            height: 1px;
            background-color: var(--primary);
            opacity: 0.3;
        }
        .sns_list {
            display: flex;
            justify-content: center;
            column-gap: 20px;
        }
        .sns_list > a {
            display: block;
            width: 45px;
            height: 45px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 45px;
        }
        .sns_list > a:first-child {
            background-image: url(img/kakao_logo_icon.svg);
        }
        .sns_list > a:nth-child(2) {
            background-image: url(img/naver_logo_icon.svg);
        }
        .sns_list > a:nth-child(3) {
            background-image: url(img/apple_logo_icon.svg);
        }
        .sns_list > a:last-child {
            background-image: url(img/samsung_logo_icon.svg);
        }
       /* header {
            background-color: darkgreen;
            text-align: center;
        } */ 
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>로그인</h1>
            <button class="prev_btn"><span class="sr-only">이전버튼</span></button> 
        </header>
        <main>
            <h2 class="title">
                <span>안녕하세요:)</span>
                <span>버거킹입니다.</span>
            </h2>
            <form action="">
                <!-- 이메일 로그인 -->
                <fieldset>
                    <legend class="sr-only">로그인화면</legend>
                    <!-- 아이디 -->
                    <label for="email" class="email">이메일 로그인</label>
                    <div class="input_box">
                        <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요">
                    </div>
                    <!-- 비밀번호 -->
                    <div class="input_box rela">
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <div class="login_option">
                        <label>
                            <input type="checkbox" class="check sr-only" checked>
                            <span>자동 로그인</span>
                        </label>
                        <label>
                            <input type="checkbox" class="check sr-only">
                            <span>아이디 저장</span>
                        </label>
                    </div>
                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>        
            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="password-reset.html">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>  
            <div class="sns_login">
                <p>SNS으로 간편하게 로그인</p>
                <div class="sns_list">
                    <a href="#"><span class="sr-only">카카오로그인</span></a>
                    <a href="#"><span class="sr-only">네이버로그인</span></a>
                    <a href="#"><span class="sr-only">애플로그인</span></a>
                    <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                </div>
            </div>   
        </main>
    </div> 
</body>
</html>
